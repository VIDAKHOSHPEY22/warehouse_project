# پیکربندی Nginx برای سرو فایل‌های استاتیک React (SPA) و پروکسی API
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # همه مسیرهای ناشناخته به index.html هدایت شوند (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # پروکسی درخواست‌های API به سرویس بک‌اند داخل شبکه Docker
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
